<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0b1020"/>
  <!-- 5 overlapping Geranium Plus colored circles -->
  <g stroke="#0b1020" stroke-width="2.2">
    <circle cx="32" cy="19.5" r="14.5" fill="#facc15" fill-opacity="0.92"/>
    <circle cx="43.9" cy="28.1" r="14.5" fill="#38bdf8" fill-opacity="0.92"/>
    <circle cx="39.3" cy="42.1" r="14.5" fill="#9333ea" fill-opacity="0.92"/>
    <circle cx="24.7" cy="42.1" r="14.5" fill="#ef4444" fill-opacity="0.92"/>
    <circle cx="20.1" cy="28.1" r="14.5" fill="#16a34a" fill-opacity="0.92"/>
  </g>
  <!-- Crisp outer ring highlights -->
  <g fill="none" stroke="rgba(248,250,252,0.45)" stroke-width="1.1">
    <circle cx="32" cy="19.5" r="14.5"/>
    <circle cx="43.9" cy="28.1" r="14.5"/>
    <circle cx="39.3" cy="42.1" r="14.5"/>
    <circle cx="24.7" cy="42.1" r="14.5"/>
    <circle cx="20.1" cy="28.1" r="14.5"/>
  </g>
  <!-- 5-color oriented central pentagon hub -->
  <g transform="translate(32,32)">
    <path d="M0,0 L-5.2,-7.2 A9,9 0 0 1 5.2,-7.2 Z" fill="#facc15"/>
    <path d="M0,0 L5.2,-7.2 A9,9 0 0 1 8.5,2.8 Z" fill="#38bdf8"/>
    <path d="M0,0 L8.5,2.8 A9,9 0 0 1 0,8.9 Z" fill="#9333ea"/>
    <path d="M0,0 L0,8.9 A9,9 0 0 1 -8.5,2.8 Z" fill="#ef4444"/>
    <path d="M0,0 L-8.5,2.8 A9,9 0 0 1 -5.2,-7.2 Z" fill="#16a34a"/>
    <circle r="8.8" fill="none" stroke="#0b1020" stroke-width="1.8"/>
    <circle r="2.6" fill="#0b1020" stroke="#f8fafc" stroke-width="0.9"/>
  </g>
</svg>
